<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Before and after tuning</title>
  <desc id="desc">Plan method (before) against tuned method (after). p99 time per handshake on busy.pcap, 128 real handshakes: 4.91 ms before, over the 4 ms budget; 2.90 ms after. False alerts in simulated clean tests: 7.8 percent before, 0.16 percent after. Interceptor found in simulated tests: 99.5 percent after 4.3 sites before; 98.4 percent after 6.5 sites after.</desc>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="20" fill="#ffffff" stroke="#e4e4e4"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g id="legend" font-size="20" fill="#3a3a3a">
      <rect x="64" y="38" width="16" height="16" rx="3" fill="#c2410c"/>
      <text x="90" y="53">Before: plan method</text>
      <rect x="316" y="38" width="16" height="16" rx="3" fill="#1a4be0"/>
      <text x="342" y="53">After: tuned method</text>
    </g>

    <!-- bar track: 297 units wide from x + 22 -->
    <g id="time" transform="translate(64 84)">
      <rect width="341" height="244" rx="14" fill="#f7f7f7"/>
      <text x="22" y="40" font-size="22" font-weight="600" fill="#111111">p99 time per handshake</text>
      <text x="22" y="66" font-size="18" fill="#616161">busy.pcap, 128 real handshakes</text>
      <text x="22" y="134" font-size="40" font-weight="700" fill="#c2410c">4.91 ms</text>
      <rect x="22" y="148" width="297" height="10" rx="5" fill="#e8e8e8"/>
      <rect x="22" y="148" width="265" height="10" rx="5" fill="#c2410c"/>
      <text x="22" y="204" font-size="40" font-weight="700" fill="#1a4be0">2.90 ms</text>
      <rect x="22" y="218" width="297" height="10" rx="5" fill="#e8e8e8"/>
      <rect x="22" y="218" width="157" height="10" rx="5" fill="#1a4be0"/>
      <g stroke="#d70015" stroke-width="2">
        <line x1="238" y1="142" x2="238" y2="164"/>
        <line x1="238" y1="212" x2="238" y2="234"/>
      </g>
      <text x="238" y="124" text-anchor="middle" font-size="18" font-weight="600" fill="#d70015">4 ms</text>
    </g>

    <g id="false-alerts" transform="translate(429 84)">
      <rect width="342" height="244" rx="14" fill="#f7f7f7"/>
      <text x="22" y="40" font-size="22" font-weight="600" fill="#111111">False alerts</text>
      <text x="22" y="66" font-size="18" fill="#616161">simulated clean tests that alert</text>
      <text x="22" y="134" font-size="40" font-weight="700" fill="#c2410c">7.8%</text>
      <rect x="22" y="148" width="297" height="10" rx="5" fill="#e8e8e8"/>
      <rect x="22" y="148" width="290" height="10" rx="5" fill="#c2410c"/>
      <text x="22" y="204" font-size="40" font-weight="700" fill="#1a4be0">0.16%</text>
      <rect x="22" y="218" width="297" height="10" rx="5" fill="#e8e8e8"/>
      <rect x="22" y="218" width="6" height="10" rx="3" fill="#1a4be0"/>
    </g>

    <g id="detection" transform="translate(795 84)">
      <rect width="341" height="244" rx="14" fill="#f7f7f7"/>
      <text x="22" y="40" font-size="22" font-weight="600" fill="#111111">Interceptor found</text>
      <text x="22" y="66" font-size="18" fill="#616161">simulated tests with an interceptor</text>
      <text x="22" y="134" font-size="40" font-weight="700" fill="#c2410c">99.5%</text>
      <text x="152" y="134" font-size="20" fill="#3a3a3a">after 4.3 sites</text>
      <rect x="22" y="148" width="297" height="10" rx="5" fill="#e8e8e8"/>
      <rect x="22" y="148" width="295" height="10" rx="5" fill="#c2410c"/>
      <text x="22" y="204" font-size="40" font-weight="700" fill="#1a4be0">98.4%</text>
      <text x="152" y="204" font-size="20" fill="#3a3a3a">after 6.5 sites</text>
      <rect x="22" y="218" width="297" height="10" rx="5" fill="#e8e8e8"/>
      <rect x="22" y="218" width="292" height="10" rx="5" fill="#1a4be0"/>
    </g>

    <text x="64" y="366" font-size="18" fill="#616161">Time: Apple M2, p99 of 20 runs. Simulation: 85% TLS 1.3, 25% of sites do not go through the interceptor.</text>
  </g>
</svg>
