# zerohour model values, tuned (Phase 3): weighted per-check log-likelihood ratios, capped per site.
# a0..d1 are the per-check failure rates calibration measures (site/lib/tune.js shows the derivation).
# Same alpha/beta as zerohour.conf, so the thresholds stay +-4.60; only the step per site changes.
theta0 = 0.9      # binary method only (kept for comparison)
theta1 = 0.2
alpha = 0.01      # max false-alert rate
beta = 0.99       # min detection rate
ttl_delta = 2     # check D: TTL change larger than this is a mismatch
weighted = 1      # 1 = weighted per-check steps, 0 = plan's binary step
a0 = 0.127         # Pr[A fails | no interceptor]: server software change, CDN node
a1 = 0.669         # Pr[A fails | interceptor]: the interceptor's own TLS stack
b0 = 0.079         # Pr[B fails | no interceptor]: certificate renewal (90-day certs)
b1 = 0.755         # Pr[B fails | interceptor]: forged certificate, new key
d0 = 0.146         # Pr[D fails | no interceptor]: route change
d1 = 0.487         # Pr[D fails | interceptor]: answer comes from fewer hops
min_sites = 3     # one site can add at most 4.60/2.5 = 1.84: alert needs 3 changed sites
log_sync = 1     # evidence log: 1 = records written in order (F_BARRIERFSYNC), alerts fully on disk
